[package]
name = "listdisk-rs"
version = "0.2.0"
edition = "2024"
authors = ["mokurin000 <mokurin000@gmail.com>"]
description = "win32 disk info utils"
categories = ["os::windows-apis", "filesystem"]
license = "MIT"
repository = "https://github.com/mokurin000/listdisk-rs"

[features]
default = [
    "volume",
    "logical-drives",
    "freespace",
    "drive-info",
    "serde",
    "wmi",
    "physical-disk",
]
volume = ["encoding", "win32_sys", "win32_sys_foundation"]
logical-drives = ["win32_sys", "win32_sys_foundation", "dep:bitvec"]
freespace = ["win32_sys"]
drive-info = []
physical-disk = ["serde"]

encoding = ["dep:utf16string"]
win32_sys = ["dep:windows-sys", "windows-sys/Win32_Storage_FileSystem"]
win32_sys_foundation = ["windows-sys/Win32_Foundation"]
wmi = ["dep:wmi"]
serde = ["dep:serde", "dep:serde_repr"]

[dependencies]
log = "0.4.22"

utf16string = { version = "0.2.0", optional = true }
windows-sys = { version = "0.61.2", optional = true }
bitvec = { version = "1.0.1", optional = true, default-features = false, features = [
    "alloc",
] }
wmi = { version = "0.18.0", optional = true }
serde = { version = "1", features = ["derive"], optional = true }
thiserror = "2.0.9"
serde_repr = { version = "0.1.20", optional = true }

[dev-dependencies]
anyhow = "1"
byte-unit = { version = "5.1.6", default-features = false, features = [
    "byte",
    "u128",
] }
pretty_env_logger = "0.5"

[[example]]
name = "list_volume"
required-features = ["volume"]

[[example]]
name = "list_drives"
required-features = ["logical-drives"]

[[example]]
name = "freespace"
required-features = ["freespace", "encoding"]

[[example]]
name = "diskdrive"
required-features = ["drive-info", "serde", "wmi"]

[[example]]
name = "physicaldisk"
required-features = ["drive-info", "physical-disk", "serde", "wmi"]

[[example]]
name = "full_usage"
required-features = ["default"]
